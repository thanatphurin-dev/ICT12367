<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="T4style.css">

<title>Image Carousel Popup</title>
</head>

<body>

<section class="gallery">

<div class="img-container">
<img src="small/s_1.jpg" alt="1">
</div>

<div class="img-container">
<img src="small/s_2.jpg" alt="2">
</div>

<div class="img-container">
<img src="small/s_3.jpg" alt="3">
</div>

<div class="img-container">
<img src="small/s_4.jpg" alt="4">
</div>

<div class="img-container">
<img src="small/s_5.jpg" alt="5">
</div>

<div class="img-container">
<img src="small/s_6.jpg" alt="6">
</div>

<div class="img-container">
<img src="small/s_7.jpg" alt="7">
</div>

<div class="img-container">
<img src="small/s_8.jpg" alt="8">
</div>

</section>

<div class="modal">
<img class="full-img" src="" alt="">
<p class="caption"></p>
</div>

<script>

const modal = document.querySelector(".modal");
const images = document.querySelectorAll(".img-container img");
const fullImg = document.querySelector(".full-img");
const caption = document.querySelector(".caption");

images.forEach((img) => {
    img.addEventListener("click", function(){
        modal.classList.add("open");
        fullImg.src = this.src;
        caption.textContent = this.alt;
    });
});

modal.addEventListener("click", () =>{
    modal.classList.remove("open");
});

</script>

</body>
</html>
